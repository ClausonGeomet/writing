project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - posts/*/index.qmd
    - "!drafts/**"
  resources:
    - posts/**/rendered-report.html

website:
  title: "Writing"
  description: "Notes on geometallurgy, mineral inference, and defensible technical decisions."
  site-url: "https://clausongeomet.com/writing/"
  navbar:
    left:
      - text: Home
        href: https://clausongeomet.com/
      - href: index.qmd
        text: Blog
      - text: Packages
        href: https://clausongeomet.com/packages/
      - text: Tools
        href: https://clausongeomet.com/tools/
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Matt Clauson · CC BY 4.0"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    link-external-newwindow: true
