name: EMC Part 2 scientific rewrite preflight
on:
  push:
    branches: [publication/emc-part2-statistical-rewrite-20261029]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install locked environment
        run: uv sync --frozen
      - name: Render complete site
        run: uv run quarto render
      - name: Inspect rendered publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          slug = "posts/emc-part2-what-assays-can-tell-us"
          root = Path("_site") / slug
          article = root / "index.html"
          assert article.is_file(), f"Missing article {article}"
          text = article.read_text()
          assert len(text) > 30000
          for phrase in ["Method of moments", "KL divergence", "Jensen", "genetic algorithm", "Statistical questions for the next stage", "six scenarios", "independent mineralogical"]:
              assert phrase.casefold() in text.casefold(), f"Missing prose {phrase}"
          assert "Review draft. Not approved for publication." not in text
          for name in ["figures/mineral_rmse_scenarios.svg", "figures/phase_null_direction.png", "publication.css"]:
              assert (root/name).is_file(), f"Missing figure/style {name}"
          for ident in ["emc-introduction","emc-forward","emc-distributions","emc-sequential","emc-design","emc-results","emc-identifiability","emc-followup","emc-empirical","emc-next","emc-conclusion","emc-evidence"]:
              assert f'id="{ident}"' in text, f"Missing section anchor {ident}"
          assert "article-mobile-outline" in text
          assert "emc-part2-what-assays-can-tell-us" in Path("_site/index.html").read_text()
          assert "draft: false" in Path(slug, "index.qmd").read_text()
          print("EMC release preflight passed:", len(text), "HTML characters, 2 figures, 12 section anchors")
          PY