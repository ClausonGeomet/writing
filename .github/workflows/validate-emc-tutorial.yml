name: Validate EMC tutorial and Quarto article

on:
  pull_request:
    paths:
      - 'posts/emc-part2-what-assays-can-tell-us/**'
      - '_quarto.yml'
      - '.github/workflows/validate-emc-tutorial.yml'

permissions:
  contents: read

jobs:
  reproduce-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned simCoDaR revision
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("ClausonGeomet/simCoDaR", ref="d9a0b27676a0cb3a4acb300a3f6b2ebc845d205d", upgrade="never")'
      - name: Install Python tutorial dependencies
        run: python -m pip install -r posts/emc-part2-what-assays-can-tell-us/tutorial/requirements.txt
      - name: Reproduce R and Python tutorial
        run: |
          mkdir -p /tmp/emc-tutorial-data
          Rscript posts/emc-part2-what-assays-can-tell-us/tutorial/generate_data.R /tmp/emc-tutorial-data
          python posts/emc-part2-what-assays-can-tell-us/tutorial/explore_emc.py /tmp/emc-tutorial-data
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render and verify downloadable sources
        run: |
          quarto render --no-execute
          test -s _site/posts/emc-part2-what-assays-can-tell-us/index.html
          for f in README.md requirements.txt generate_data.R explore_emc.py baselines.py emc_prototypes.py; do
            test -s "_site/posts/emc-part2-what-assays-can-tell-us/tutorial/$f"
          done
